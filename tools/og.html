<!doctype html>
<!-- Plantilla de la imagen para compartir (1200x630). Se captura con tools/generar-og.mjs. -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #08090B; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; font-family: "Archivo", sans-serif; color: #F7F7F7; }
  .foto { position: absolute; top: 0; right: 0; width: 700px; height: 630px; object-fit: cover; object-position: 50% 20%; }
  .velo { position: absolute; inset: 0; background: linear-gradient(90deg, #08090B 0%, #08090B 40%, rgba(8,9,11,.55) 52%, rgba(8,9,11,0) 66%), linear-gradient(0deg, rgba(8,9,11,.85) 0%, rgba(8,9,11,0) 30%); }
  .txt { position: absolute; left: 64px; top: 64px; width: 620px; }
  .logo { width: 210px; display: block; }
  .t { margin: 44px 0 0; font-weight: 820; font-stretch: 68%; font-size: 118px; line-height: .86; text-transform: uppercase; }
  .c { margin: 14px 0 0; font-weight: 500; font-stretch: 125%; font-size: 24px; letter-spacing: .3em; color: #C5CBD2; }
  .f { position: absolute; left: 64px; bottom: 56px; display: flex; gap: 28px; align-items: baseline; font-stretch: 118%; font-weight: 700; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; }
  .f b { color: #FF6A00; font-weight: 700; }
  .f span { color: #D5B16D; }
  .precio { position: absolute; left: 64px; top: 452px; display: flex; align-items: baseline; gap: 14px; padding: 12px 18px; border: 1px solid rgba(213,177,109,.55); }
  .precio strong { font-weight: 820; font-stretch: 72%; font-size: 44px; }
  .precio small { font-stretch: 112%; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #C5CBD2; }
</style>
</head>
<body>
  <div class="og">
    <img class="foto" src="../assets/img/festival-artistas-900.jpg" alt="">
    <div class="velo"></div>
    <div class="txt">
      <img class="logo" src="../assets/img/logo-rumbas-de-la-ciudad.webp" alt="">
      <p class="t">Festival<br>Náutico</p>
      <p class="c">CARTAGENA 2026</p>
    </div>
    <div class="precio"><strong>$1.000.000 COP</strong><small>por persona / por día</small></div>
    <div class="f"><b>13 · 14 NOV</b><span>Remate Ultra Privado 15 NOV</span></div>
  </div>
</body>
</html>
